name: Build And Verify

on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'data/**'
      - 'scripts/**'
      - 'scenes/**'
      - '.github/workflows/server-tests.yml'
      - 'Game.csproj'
      - 'project.godot'
      - 'export_presets.cfg'
  pull_request:
    paths:
      - 'server/**'
      - 'data/**'
      - 'scripts/**'
      - 'scenes/**'
      - '.github/workflows/server-tests.yml'
      - 'Game.csproj'
      - 'project.godot'
      - 'export_presets.cfg'

concurrency:
  group: build-and-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore game dependencies
        run: dotnet restore Game.csproj

      - name: Build game
        run: dotnet build Game.csproj --no-restore -c Release

  server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: crownroad_test
          POSTGRES_USER: crownroad
          POSTGRES_PASSWORD: crownroad-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crownroad -d crownroad_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore -p:Configuration=Release

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run tests
        env:
          CROWNROAD_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=crownroad_test;Username=crownroad;Password=crownroad-ci-password;Pooling=false
        run: dotnet run -c Release -- --test

      - name: Validate game data
        run: dotnet run -c Release -- --test-data ../data

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - game-build
      - server-test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      # The Dockerfile copies shared game sources, so it builds from the repo root.
      - name: Build Docker image
        run: docker build --file Dockerfile --tag crownroad-server:latest ..

      # Production refuses to start without a password-protected Redis, and /health checks it.
      - name: Verify health endpoint
        run: |
          docker network create crownroad-ci
          trap 'docker rm -f crownroad-test crownroad-postgres-test crownroad-redis-test >/dev/null 2>&1 || true; docker network rm crownroad-ci >/dev/null 2>&1 || true' EXIT
          redis_password="$(openssl rand -hex 24)"
          printf '%s' "$redis_password" > "$RUNNER_TEMP/redis-password"
          chmod 644 "$RUNNER_TEMP/redis-password"
          docker run -d --name crownroad-postgres-test --network crownroad-ci \
            -e POSTGRES_DB=crownroad -e POSTGRES_USER=crownroad -e POSTGRES_PASSWORD=crownroad-ci-password \
            postgres:17-alpine
          docker run -d --name crownroad-redis-test --network crownroad-ci \
            redis:7.4-alpine redis-server --requirepass "$redis_password"
          until docker exec crownroad-postgres-test pg_isready -U crownroad -d crownroad; do sleep 1; done
          docker run -d --name crownroad-test --network crownroad-ci -p 8080:8080 \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e AllowedOrigins=https://app.example.invalid \
            -e 'ConnectionStrings__Crownroad=Host=crownroad-postgres-test;Port=5432;Database=crownroad;Username=crownroad;Password=crownroad-ci-password;Pooling=false' \
            -e Redis__Configuration=crownroad-redis-test:6379,abortConnect=false \
            -e REDIS_PASSWORD_FILE=/run/secrets/redis_password \
            -v "$RUNNER_TEMP/redis-password:/run/secrets/redis_password:ro" \
            crownroad-server:latest
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/health | grep -q '"status":"healthy"'; then exit 0; fi
            sleep 2
          done
          curl -s http://localhost:8080/health || true
          docker logs crownroad-test
          exit 1
