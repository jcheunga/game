services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    volumes:
      - crownroad-redis:/data
    secrets:
      - source: redis_password
        target: redis_password
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  crownroad-server:
    build:
      context: .
    restart: unless-stopped
    scale: ${CROWNROAD_SERVER_REPLICAS:-2}
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      Redis__Configuration: redis:6379,abortConnect=false
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      TrustForwardedHeaders: "true"
      ADMIN_API_KEY_FILE: /run/secrets/admin_api_key
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_PATH: /run/secrets/google_play_service_account.json
      APPLE_IAP_PRIVATE_KEY_PATH: /run/secrets/apple_iap_private_key.p8
    expose:
      - "8080"
    secrets:
      - source: redis_password
        target: redis_password
      - source: admin_api_key
        target: admin_api_key
      - source: google_play_service_account
        target: google_play_service_account.json
      - source: apple_iap_private_key
        target: apple_iap_private_key.p8
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      crownroad-server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Public website, built by deploy.sh with scripts/tools/build_site.py.
      - ../site/dist:/srv/site:ro
      - caddy-data:/data
      - caddy-config:/config
    # API access logs include client IP addresses. Rotate them so they are
    # overwritten instead of kept indefinitely (see the privacy policy).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  crownroad-redis:
  caddy-data:
  caddy-config:

secrets:
  redis_password:
    file: ${REDIS_PASSWORD_SOURCE:?set REDIS_PASSWORD_SOURCE in .env.production}
  admin_api_key:
    file: ${ADMIN_API_KEY_SOURCE:?set ADMIN_API_KEY_SOURCE in .env.production}
  google_play_service_account:
    file: ${GOOGLE_PLAY_SERVICE_ACCOUNT_SOURCE:?set GOOGLE_PLAY_SERVICE_ACCOUNT_SOURCE in .env.production}
  apple_iap_private_key:
    file: ${APPLE_IAP_PRIVATE_KEY_SOURCE:?set APPLE_IAP_PRIVATE_KEY_SOURCE in .env.production}
